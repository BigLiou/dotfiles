"$schema" = 'https://starship.rs/config-schema.json'

# ============================================
# 调色板
# ============================================
palette = 'my_theme'

# ============================================
# 左侧 prompt — 主行色块条
# ============================================
format = """
[](user_bg)\
$os\
$username\
[](bg:dir_bg fg:user_bg)\
$directory\
[](fg:dir_bg bg:git_bg)\
$git_branch\
$git_status\
[](fg:git_bg bg:time_bg)\
$time\
[ ](fg:time_bg)\
$line_break
$character
"""

# ============================================
# 右侧 prompt — 语言/工具版本信息
# ============================================
right_format = """
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$python\
$nim\
$rust\
$scala\
$docker_context\
$cmd_duration
"""

# ====================================================================
# 左侧模块
# ====================================================================

[os]
disabled = false
style = "bg:user_bg fg:left_fg1"

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[username]
show_always = true
style_user = "bg:user_bg fg:left_fg1"
style_root = "bg:user_bg fg:left_fg1"
format = '[$user ]($style)'
disabled = false

[directory]
style = "bg:dir_bg fg:left_fg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:git_bg fg:left_fg2"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:git_bg"
format = '[$all_status$ahead_behind ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:time_bg fg:left_fg1"
format = '[  $time ]($style)'

# ====================================================================
# 右侧模块 — 无背景色
# ====================================================================

[c]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[cpp]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[docker_context]
symbol = ""
style = "fg:docker_fg"
format = '[$symbol $context]($style) '

[elixir]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[elm]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[golang]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[gradle]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[haskell]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[java]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[julia]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[nodejs]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[python]
symbol = ""
style = "fg:right_fg"
format = '[$symbol $version(\($virtualenv\))]($style) '
detect_folders = [".venv", "venv", "env"]

[nim]
symbol = "󰆥"
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[rust]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

[scala]
symbol = ""
style = "fg:right_fg"
format = '[$symbol ($version)]($style) '

# ====================================================================
# 通用模块
# ====================================================================

[cmd_duration]
min_time = 5000
show_milliseconds = true
style = "fg:duration_fg"
format = '[󱦟 $duration]($style)'

[character]
success_symbol = "[❯](fg:green bold)"
error_symbol = "[❯](fg:red bold)"

# ====================================================================
# 调色板定义
# ====================================================================
[palettes.my_theme]
# 左侧色块背景色
user_bg = "#9A348E"
dir_bg  = "#DA627D"
git_bg  = "#FCA17D"
time_bg = "#33658A"

# 左侧文字颜色（在彩色背景上）
left_fg1 = "#ffffff"
left_fg2 = "#11111b"

# 右侧浮文颜色
right_fg    = "#86BBD8"
docker_fg   = "#06969A"
duration_fg = "#fbbf24"
