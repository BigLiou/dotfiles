# =====================
# 基础
# =====================
# tmux 3.1+ 推荐 tmux-256color；screen-256color 是旧默认值，缺真彩色能力
set -g default-terminal "tmux-256color"
# 向终端声明支持真彩色（Append 到默认 terminal-features）
set -as terminal-features ",RGB"

# ESC 无延迟（vim 退出插入模式更跟手）
set -s escape-time 0
# 焦点事件（嵌套 tmux / 切换面板时能感知）
set -g focus-events on

set -g history-limit 50000

# 窗口与面板从 1 开始编号，关窗后自动重排
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 面板顶部显示标题行（多面板时更好辨认）
setw -g pane-border-status top

# 剪贴板：优先通过 OSC 52 交给本地终端处理
# 需要终端支持（Windows Terminal 1.18+ / WezTerm / Ghostty / iTerm2）
set -g set-clipboard on
# 允许图片、超链接等序列透传到终端
set -g allow-passthrough on

# 快捷键前缀改 Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 用 Ctrl+a r 重载配置
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# =====================
# 分割窗口
# =====================
bind | split-window -h
bind - split-window -v

# =====================
# 窗口切换（Vim 风格）
# =====================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# =====================
# 鼠标支持
# =====================
set -g mouse on

# =====================
# 系统剪贴板（运行时判断，不用 chezmoi 模板）
# macOS 用 pbcopy/pbpaste；其它平台用 xclip
# =====================
if-shell -b 'command -v pbcopy >/dev/null 2>&1' {
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"
    bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe "pbcopy"
    bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"
} {
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "xclip -selection clipboard"
    bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe "xclip -selection clipboard"
    bind p run "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"
}

# =====================
# 弹窗（tmux 3.2+ display-popup）
# =====================
# Ctrl+a g：浮层打开 lazygit
bind g display-popup -E -w 80% -h 70% "lazygit"

# Ctrl+a f：用 fzf 快速跳转窗口
# 注意 ##{...} 是转义，避免外层 tmux 提前展开格式变量
bind f display-popup -E -w 60% -h 50% "tmux list-windows -F '##{window_index}: ##{window_name}' | fzf --reverse | cut -d: -f1 | xargs -r tmux select-window -t"

# Ctrl+a m：浮层打开 btop 系统监控（关闭即退出，零常驻开销）
bind m display-popup -E -w 90% -h 85% -T " 系统监控 " "btop"

# =====================
# 插件与状态栏（插件装好才启用网速段；mac 未装插件时只显示时间）
# =====================
if-shell -b '[ -d "$HOME/.tmux/plugins/tpm" ]' {
    set -g status-interval 2
    set -g status-right-length 100
    set -g status-right "#{network_bandwidth} | %H:%M"
    set -g @plugin 'tmux-plugins/tpm'
    set -g @plugin 'xamut/tmux-network-bandwidth'
    run '~/.tmux/plugins/tpm/tpm'
} {
    set -g status-interval 5
    set -g status-right "%H:%M"
}
